<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Group Chat · Campus Collab</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(rgba(2,6,23,0.9), rgba(2,6,23,0.9)),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4");
      background-size: cover;
      background-position: center;
      color: #e5e7eb;
    }

    header {
      padding: 16px 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(10px);
      background: rgba(2,6,23,0.7);
      border-bottom: 1px solid #1e293b;
    }

    header h2 {
      margin: 0;
      color: #a5b4fc;
      font-size: 1.4rem;
    }

    header a {
      color: #9ca3af;
      text-decoration: none;
    }

    .chat-box {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 70%;
      animation: fadeUp 0.2s ease forwards;
    }

    .sender {
      font-size: 0.75rem;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .bubble {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      border: 1px solid;
    }

    .you {
      align-self: flex-end;
      text-align: right;
    }

    .you .sender {
      color: #c7d2fe;
    }

    .you .bubble {
      background: rgba(79,70,229,0.35);
      border-color: rgba(79,70,229,0.6);
    }

    .other {
      align-self: flex-start;
      text-align: left;
    }

    .other .sender {
      color: #a5b4fc;
    }

    .other .bubble {
      background: rgba(148,163,184,0.12);
      border-color: rgba(148,163,184,0.3);
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid #1e293b;
      background: rgba(2,6,23,0.85);
      display: flex;
      gap: 12px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #1e293b;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border-radius: 30px;
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<header>
  <a href="dashboard.html">⬅ Dashboard</a>
  <h2>💬 Campus Group Chat</h2>
</header>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">
  <input id="messageInput" placeholder="Type a message…" />
  <button onclick="sendMessage()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) window.location.href = "login.html";

  const socket = io();
  const chatBox = document.getElementById("chatBox");
  const input = document.getElementById("messageInput");

  /* =========================
     LOAD OLD MESSAGES (DB)
  ========================= */
  fetch("/api/chat/messages")
    .then(res => res.json())
    .then(messages => {
      messages.forEach(msg => {
        renderMessage(msg);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(err => {
      console.error("Failed to load messages", err);
    });

  /* =========================
     SEND MESSAGE
  ========================= */
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    socket.emit("sendMessage", {
      senderId: user.id,
      senderName: user.name,
      text
    });

    input.value = "";
  }

  /* =========================
     RECEIVE MESSAGE (REALTIME)
  ========================= */
  socket.on("receiveMessage", msg => {
    renderMessage(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  /* =========================
     RENDER MESSAGE
  ========================= */
  function renderMessage(msg) {
    const isYou = msg.senderId === user.id;

    const div = document.createElement("div");
    div.className = `message ${isYou ? "you" : "other"}`;
    div.innerHTML = `
      <div class="sender">${isYou ? "You" : msg.senderName}</div>
      <div class="bubble">${msg.text}</div>
    `;

    chatBox.appendChild(div);
  }
</script>

</body>
</html>
